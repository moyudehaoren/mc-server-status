<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minecraft 开服状态</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --line: #262b36;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --green: #2ecc71;
    --red: #e74c3c;
    --yellow: #f1c40f;
    --gray: #7f8c9b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(1200px 600px at 50% -10%, #1d2330 0%, var(--bg) 60%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 28px 28px 20px;
    box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }
  h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: .5px; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }

  .status {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 20px;
    border-radius: 14px;
    background: #12151b;
    border: 1px solid var(--line);
  }
  .dot {
    width: 16px; height: 16px; border-radius: 50%;
    flex: 0 0 auto;
    background: var(--gray);
    box-shadow: 0 0 0 0 rgba(0,0,0,0);
  }
  .dot.on  { background: var(--green);  animation: pulse 2s infinite; }
  .dot.off { background: var(--red); }
  .dot.warn{ background: var(--yellow); }
  .dot.unknown { background: var(--gray); }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(46,204,113,.55); }
    70%  { box-shadow: 0 0 0 12px rgba(46,204,113,0); }
    100% { box-shadow: 0 0 0 0 rgba(46,204,113,0); }
  }
  .status .text { font-size: 22px; font-weight: 600; }
  .status .hint { margin-left: auto; color: var(--muted); font-size: 12px; text-align: right; max-width: 45%; }

  .players { margin: 20px 0 6px; }
  .count { font-size: 14px; color: var(--muted); }
  .count strong { color: var(--text); font-size: 20px; }
  .chips { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; padding: 0; }
  .chips li {
    background: #1f2531; border: 1px solid var(--line);
    color: #cfd6e4; font-size: 13px; padding: 5px 11px; border-radius: 999px;
  }
  .chips li.empty { background: transparent; border-style: dashed; color: var(--muted); }

  .rows { margin-top: 18px; border-top: 1px solid var(--line); }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 13px;
  }
  .row .label { color: var(--muted); width: 76px; flex: 0 0 auto; }
  .row .val { font-weight: 600; }
  .row .val.on { color: var(--green); }
  .row .val.off { color: var(--red); }
  .row .val.warn { color: var(--yellow); }
  .row .val.unknown { color: var(--gray); }
  .row .time { margin-left: auto; color: var(--muted); font-size: 12px; }

  /* ── 双栏布局：左边电脑状态，右边开服状态 ── */
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 280px) minmax(0, 560px);
    gap: 20px;
    align-items: start;
    width: 100%;
    justify-content: center;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 560px); }
  }

  .pc-card h2 { margin: 0 0 14px; font-size: 16px; font-weight: 600; letter-spacing: .5px; }
  .pc-status {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border-radius: 12px;
    background: #12151b; border: 1px solid var(--line);
  }
  .pc-status .text { font-size: 16px; font-weight: 600; }
  .dot.small { width: 12px; height: 12px; }

  .metric { margin-top: 16px; }
  .metric-head { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; color: var(--muted); }
  .metric-head .value { color: var(--text); font-weight: 600; }
  .bar { height: 6px; border-radius: 3px; background: #222833; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--green); border-radius: 3px; transition: width .4s ease; }
  .bar > i.warn { background: var(--yellow); }
  .bar > i.high { background: var(--red); }
  .metric-sub { margin-top: 5px; color: var(--muted); font-size: 12px; }
  .pc-rows { margin-top: 18px; border-top: 1px solid var(--line); }

  footer {
    display: flex; justify-content: space-between; gap: 12px;
    margin-top: 16px; color: var(--muted); font-size: 12px;
  }
  footer a { color: #6ea8fe; text-decoration: none; }
</style>
</head>
<body>
<div class="layout">

<aside class="card pc-card">
  <h2>我的电脑</h2>

  <div class="pc-status">
    <span class="dot small unknown" id="pcDot"></span>
    <span class="text" id="pcStatus">读取中</span>
  </div>

  <div class="metric">
    <div class="metric-head"><span>CPU 占用</span><span class="value" id="cpuValue">–</span></div>
    <div class="bar"><i id="cpuBar"></i></div>
  </div>

  <div class="metric">
    <div class="metric-head"><span>内存占用</span><span class="value" id="memValue">–</span></div>
    <div class="bar"><i id="memBar"></i></div>
    <div class="metric-sub" id="memSub">无数据</div>
  </div>

  <div class="rows pc-rows">
    <div class="row">
      <span class="label">开机时长</span>
      <span class="time" id="uptimeValue">–</span>
    </div>
    <div class="row">
      <span class="label">上报时间</span>
      <span class="time" id="pcUpdated">–</span>
    </div>
  </div>
</aside>

<main class="card">
  <h1>Minecraft 开服状态</h1>
  <p class="sub" id="subtitle">正在读取状态…</p>

  <div class="status">
    <span class="dot unknown" id="dot"></span>
    <span class="text" id="statusText">读取中</span>
    <span class="hint" id="statusHint"></span>
  </div>

  <section class="players">
    <div class="count"><strong id="playerCount">–</strong> <span id="playerMax"></span> 人在线</div>
    <ul class="chips" id="playerList"></ul>
  </section>

  <section class="rows">
    <div class="row">
      <span class="label">游戏主机</span>
      <span class="val unknown" id="gameState">–</span>
      <span class="time" id="gameTime"></span>
    </div>
    <div class="row">
      <span class="label">樱花隧道</span>
      <span class="val unknown" id="tunnelState">–</span>
      <span class="time" id="tunnelTime"></span>
    </div>
  </section>

  <footer>
    <span id="refreshInfo">每 30 秒自动刷新</span>
    <span id="lastRefresh"></span>
  </footer>
</main>
</div>

<script>
// ── 可调参数 ────────────────────────────────────────────────────────────────
// 游戏心跳超过该时长即视为"失联"。
// ⚠️ 必须明显大于心跳脚本的 keepAliveMinutes（默认 10 分钟），
//    否则游戏中会一直误报"数据过期"。
const HEARTBEAT_STALE_MINUTES = 15;
// 隧道检测超过该时长即视为"检测器异常"（Actions 默认每 5 分钟检测，30 分钟节流写入）
const TUNNEL_STALE_MINUTES = 45;
const REFRESH_MS = 30 * 1000;

// ── 工具函数 ────────────────────────────────────────────────────────────────
function ageMinutes(iso) {
  if (!iso) return null;
  const t = Date.parse(iso);
  if (Number.isNaN(t)) return null;
  return (Date.now() - t) / 60000;
}
function humanAge(iso) {
  const m = ageMinutes(iso);
  if (m === null) return '无数据';
  if (m < 1) return '刚刚';
  if (m < 60) return Math.floor(m) + ' 分钟前';
  const h = m / 60;
  if (h < 24) return Math.floor(h) + ' 小时前';
  return Math.floor(h / 24) + ' 天前';
}
async function loadJson(path) {
  // 加时间戳绕过 CDN / 浏览器缓存
  const res = await fetch(path + '?t=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error(path + ' HTTP ' + res.status);
  return await res.json();
}

// ── 状态判定 ────────────────────────────────────────────────────────────────
function computeState(game, tunnel) {
  const gameClaimsOnline = game.online === true;
  const gameAge = ageMinutes(game.updated_at);
  const gameStale = gameClaimsOnline && (gameAge === null || gameAge > HEARTBEAT_STALE_MINUTES);
  const gameOnline = gameClaimsOnline && !gameStale;

  const tunnelAge = ageMinutes(tunnel.updated_at);
  const tunnelKnown = tunnel.updated_at != null && tunnelAge !== null && tunnelAge <= TUNNEL_STALE_MINUTES;
  const tunnelOnline = tunnelKnown && tunnel.online === true;

  if (gameStale) {
    return { key: 'unknown', title: '主机失联 / 数据过期', hint: '心跳已停止更新，可能电脑关机或脚本未运行' };
  }
  if (gameOnline && tunnelOnline) {
    return { key: 'on', title: '开服中', hint: '' };
  }
  if (gameOnline && !tunnelOnline) {
    return {
      key: 'warn', title: '游戏已开，隧道未开',
      hint: tunnelKnown ? '朋友暂时连不上，请开樱花穿透' : '隧道状态未知（未配置隧道检测）'
    };
  }
  if (!gameOnline && tunnelOnline) {
    return { key: 'warn', title: '隧道在线，游戏未开', hint: '穿透开着但游戏没开' };
  }
  return { key: 'off', title: '未开服', hint: '' };
}

// ── 渲染 ────────────────────────────────────────────────────────────────────
function render(game, tunnel) {
  const st = computeState(game, tunnel);

  document.getElementById('dot').className = 'dot ' + st.key;
  document.getElementById('statusText').textContent = st.title;
  document.getElementById('statusHint').textContent = st.hint || '';

  // 玩家
  const names = Array.isArray(game.players) ? game.players : [];
  const count = typeof game.count === 'number' ? game.count : names.length;
  const online = st.key === 'on' || (game.online === true && st.key !== 'unknown');
  document.getElementById('playerCount').textContent = online ? count : '–';
  document.getElementById('playerMax').textContent = online && game.max ? '/ ' + game.max : '';

  const list = document.getElementById('playerList');
  list.innerHTML = '';
  if (online && names.length) {
    for (const n of names) {
      const li = document.createElement('li');
      li.textContent = n;
      list.appendChild(li);
    }
  } else {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = online ? '暂无玩家在线' : '离线';
    list.appendChild(li);
  }

  // 子状态：游戏主机
  const gEl = document.getElementById('gameState');
  if (st.key === 'unknown') { gEl.className = 'val unknown'; gEl.textContent = '失联'; }
  else if (game.online === true) { gEl.className = 'val on'; gEl.textContent = '运行中'; }
  else { gEl.className = 'val off'; gEl.textContent = '未运行'; }
  document.getElementById('gameTime').textContent = humanAge(game.updated_at);
  if (game.version) document.getElementById('gameTime').textContent += ' · ' + game.version;

  // 子状态：樱花隧道
  const tEl = document.getElementById('tunnelState');
  if (!tunnel.updated_at) { tEl.className = 'val unknown'; tEl.textContent = '未配置'; }
  else if (!tunnelKnown(tunnel)) { tEl.className = 'val unknown'; tEl.textContent = '数据过期'; }
  else if (tunnel.online === true) { tEl.className = 'val on'; tEl.textContent = '在线'; }
  else { tEl.className = 'val off'; tEl.textContent = '离线'; }
  const tTime = humanAge(tunnel.updated_at);
  document.getElementById('tunnelTime').textContent =
    tunnel.status_reason ? tTime + ' · ' + tunnel.status_reason : tTime;

  renderPc(game);
  document.getElementById('lastRefresh').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN');
}

// ── 左侧面板：电脑状态 ──────────────────────────────────────────────────────
// 心跳脚本在游戏在线时每 10 分钟刷新一次，离线时每 30 分钟刷新一次
// （对应 host.config.json 的 keepAliveMinutes / machineKeepAliveMinutes）
const PC_STALE_ONLINE_MINUTES = 15;   // 游戏中：超过 15 分钟没上报 → 判定关机/失联
const PC_STALE_OFFLINE_MINUTES = 40;  // 游戏没开：离线心跳 30 分钟一次，留 10 分钟余量

function applyMetric(barId, valueId, percent) {
  const bar = document.getElementById(barId);
  const val = document.getElementById(valueId);
  if (typeof percent !== 'number' || !Number.isFinite(percent)) {
    bar.style.width = '0%';
    bar.className = '';
    val.textContent = '–';
    return;
  }
  const p = Math.max(0, Math.min(100, percent));
  bar.style.width = p + '%';
  bar.className = p >= 90 ? 'high' : (p >= 70 ? 'warn' : '');
  val.textContent = Math.round(p) + '%';
}

function formatUptime(minutes) {
  if (typeof minutes !== 'number' || !Number.isFinite(minutes) || minutes < 0) return '–';
  const d = Math.floor(minutes / 1440);
  const h = Math.floor((minutes % 1440) / 60);
  const m = Math.floor(minutes % 60);
  if (d > 0) return d + ' 天 ' + h + ' 小时';
  if (h > 0) return h + ' 小时 ' + m + ' 分';
  return m + ' 分钟';
}

function renderPc(game) {
  const online = game.online === true;
  const age = ageMinutes(game.updated_at);
  const limit = online ? PC_STALE_ONLINE_MINUTES : PC_STALE_OFFLINE_MINUTES;
  const fresh = age !== null && age <= limit;

  const dot = document.getElementById('pcDot');
  const statusText = document.getElementById('pcStatus');
  if (!game.updated_at) {
    dot.className = 'dot small unknown';
    statusText.textContent = '未知';
  } else if (fresh) {
    dot.className = 'dot small on';
    statusText.textContent = online ? '已开机 · 游戏中' : '已开机';
  } else {
    dot.className = 'dot small off';
    statusText.textContent = '已关机 / 失联';
  }

  const m = game.machine || {};
  const hasMachine = fresh && !!game.machine;
  applyMetric('cpuBar', 'cpuValue', hasMachine ? m.cpu_percent : null);
  applyMetric('memBar', 'memValue', hasMachine ? m.mem_percent : null);

  document.getElementById('memSub').textContent =
    hasMachine && typeof m.mem_used_gb === 'number' && typeof m.mem_total_gb === 'number'
      ? m.mem_used_gb + ' / ' + m.mem_total_gb + ' GB'
      : '无数据';

  document.getElementById('uptimeValue').textContent = hasMachine ? formatUptime(m.uptime_minutes) : '–';
  document.getElementById('pcUpdated').textContent = humanAge(game.updated_at);
}

function tunnelKnown(tunnel) {
  const a = ageMinutes(tunnel.updated_at);
  return tunnel.updated_at != null && a !== null && a <= TUNNEL_STALE_MINUTES;
}

// ── 主循环 ──────────────────────────────────────────────────────────────────
async function refresh() {
  const sub = document.getElementById('subtitle');
  try {
    const [game, tunnel] = await Promise.all([
      loadJson('status.json'),
      loadJson('tunnel.json').catch(() => ({}))   // 隧道文件可选
    ]);
    sub.textContent = '心跳：主机脚本 → status.json　|　隧道：GitHub Actions → tunnel.json';
    render(game, tunnel || {});
  } catch (err) {
    sub.textContent = '读取数据失败：' + err.message;
    document.getElementById('dot').className = 'dot unknown';
    document.getElementById('statusText').textContent = '状态未知';
    document.getElementById('statusHint').textContent = '';
  }
}

refresh();
setInterval(refresh, REFRESH_MS);
// 页面重新获得焦点时立即刷新一次
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
